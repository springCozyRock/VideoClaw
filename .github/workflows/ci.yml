name: Offline workspace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r video-claw/video-claw/backend/requirements.txt opencv-python-headless
      - run: python scripts/check_repo.py --tracked
      - run: python scripts/test_workspace.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-claw/video-claw/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
